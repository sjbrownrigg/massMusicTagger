[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "massmusictagger"
version = "3.0.0"
description = "Multi-source mass audio tagger — Discogs and MusicBrainz with cascading fallback"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}

dependencies = [

    # Absorbed from discogstagger3 with its tagging core.
    "python3-discogs-client>=2.8",
    "mediafile>=0.17",
    "mutagen>=1.47",
    "requests>=2.31",
    "mako>=1.3",
    "watchdog>=4.0",
    "chardet",
    "r128gain>=1.0",
    "rapidfuzz>=3.0",
    "pyyaml>=6.0",
    "Pillow>=10.0",

    # MusicBrainz
    "musicbrainzngs>=0.7.1",

    # Mass-tagger UX
    "rich>=13.0",
]

[project.optional-dependencies]
acoustid = [
    # Tiers 6 & 7: AcoustID audio fingerprinting.
    # Requires system dependency: fpcalc (from the chromaprint package).
    #   apt install libchromaprint-tools   # Debian/Ubuntu
    #   brew install chromaprint         # macOS
    "pyacoustid>=1.3",
]
discid = [
    # Tier 5: DiscID (CD TOC hash) lookup.
    # Requires system library: libdiscid.
    #   apt install libdiscid0   # Debian/Ubuntu
    #   brew install libdiscid   # macOS
    "discid>=1.2",
]
fingerprint = [
    # All fingerprinting tiers (acoustid + discid) in one install.
    "pyacoustid>=1.3",
    "discid>=1.2",
]
dev = [
    "pytest>=9.0",
    "pytest-cov",
]

[project.scripts]
mmt = "massmusictagger.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Shipped defaults live inside the package so they are installed by pip and
# locatable from __file__. conf/source_hints.yaml used to sit at the repo root
# and be named by a working-directory-relative config path, so the feature was
# silently inert for every installed copy.
"massmusictagger" = ["conf/*.yaml", "conf/*.ini", "conf/*.conf", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["test"]
