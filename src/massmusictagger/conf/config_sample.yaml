# ─────────────────────────────────────────────────────────────────────────────
# massMusicTagger — sample configuration
# ─────────────────────────────────────────────────────────────────────────────
#
# DO NOT edit, rename, or delete this file.  It documents every available
# setting with comments, and serves as the fallback config when no
# conf/config.yaml is present.
#
# Installation
# ────────────
# 1. Copy this file to conf/config.yaml
# 2. Edit conf/config.yaml — set your paths, credentials, and preferences.
# 3. Copy conf/discogs_sample.yaml → conf/discogs.yaml and add credentials.
# 4. Copy conf/musicbrainz_sample.yaml → conf/musicbrainz.yaml and add credentials.
# 5. Copy conf/formats_sample.ini → conf/formats.ini and customise.
# 6. conf/config.yaml, conf/discogs.yaml, conf/musicbrainz.yaml, and
#    conf/formats.ini are gitignored — never commit credentials.
#
# Usage:
#   mmt
#
# Source-specific settings and credentials live in their own named files,
# loaded via extra_configs.  Paths resolve relative to THIS FILE's directory,
# so no absolute path is ever needed and the same config works on a laptop and
# in a container:
#
#   extra_configs:
#     - credentials/discogs.yaml
#     - credentials/musicbrainz.yaml
#
# The layout, beside this config file:
#
#   config.yaml              this file, copied and edited
#   formats.ini              your file and directory naming (found automatically)
#   credentials/             API tokens       (extra_configs)
#
# That is all of it -- the config directory holds what you own. Mako templates
# and the rule tables belong to discogstagger3 and ship inside the package.
#
# This file is NEVER edited directly and is NEVER loaded at run time.  It is
# reference documentation for every available setting.  Defaults come from the
# schema table in discogstagger/config_schema.py -- see that file to find where
# a value you did not set came from.

# ─────────────────────────────────────────────────────────────────────────────
common:
# ─────────────────────────────────────────────────────────────────────────────

  user_agent: "massMusicTagger/2.0.0 +https://github.com/sjbrownrigg/massMusicTagger"
  formats_file: ""
  source_dir: ""
  dest_dir: ""
  watch_poll_interval: 30


# ─────────────────────────────────────────────────────────────────────────────
source:

  # Path to the source-format hints file (relative to CWD / massMusicTagger root).
  # Keyword lists matched case-insensitively against the source folder basename
  # to infer digital vs vinyl origin.  Applied to both Discogs and MusicBrainz:
  #   Discogs  — rejects candidates whose medium type conflicts (e.g. vinyl LP
  #              for a "24 Bit" folder); also suppresses year so remaster
  #              releases on Discogs can surface beyond the original year.
  #   MB       — logs a WARNING when matched release format conflicts.
  # Leave empty to disable.
  # Leave empty to use the copy shipped inside the package. A path here
  # resolves beside config.yaml -- "conf/source_hints.yaml" pointed at a
  # directory that only exists in a source checkout, so the feature was
  # silently off for every installed copy.
  source_hints_file: ""
# ─────────────────────────────────────────────────────────────────────────────
#
# 'priority' is an ordered list of sources to try for each album.
# Sources are tried left-to-right; the first confident match wins.
#
# Built-in source names:
#   discogs        — Discogs API (requires user_token in [discogs])
#   musicbrainz    — MusicBrainz API (requires user_agent in [musicbrainz])
#   local          — local JSON fixture (for testing)
#   existing_tags  — read metadata already embedded in the audio files;
#                    used as a fallback to organise albums without any
#                    database match.  No API calls are made; no new tags
#                    are written — files are only renamed/moved.
#
# Examples:
#   priority: [discogs]                                # Discogs only
#   priority: [musicbrainz, discogs]                  # MB first, Discogs fallback
#   priority: [discogs, musicbrainz, existing_tags]   # full cascade with fallback

  priority:
    - discogs
    - musicbrainz
    - existing_tags

  # The following keys are kept for backward compatibility with discogstagger3.
  # 'name' is still accepted: it maps to a single-element priority list.
  name:    discogs    # legacy — overridden by 'priority' when both present


# Source-specific settings live in their own named files (all in conf/):
#   conf/discogs.yaml       — Discogs API defaults
#   conf/musicbrainz.yaml   — MusicBrainz API defaults
#
# Load them (and your personal credential files) via extra_configs in your
# personal config.  Example conf/config_personal.yaml:
#
#   extra_configs:
#     - conf/discogs.yaml
#     - conf/musicbrainz.yaml
#     - conf/discogs_personal.yaml
#     - conf/musicbrainz_personal.yaml


# ─────────────────────────────────────────────────────────────────────────────
batch:
# ─────────────────────────────────────────────────────────────────────────────

  id_file: id.txt
  searchdiscogs: false
  tracklength_tolerance: 5.0
  title_similarity_threshold: 60

  # Number of concurrent worker threads for mass processing.
  # Set to 1 for sequential processing (required for --review mode).
  workers: 1

  # Path to the JSON audit log (append-only).  Records every processed
  # directory with outcome, source used, matched release, and elapsed time.
  # Leave empty to disable the audit log (and with it --undo). To enable it,
  # give an absolute path on a writable volume rather than a ~/ path: in a
  # container HOME is not necessarily writable.
  #   audit_log: /cache/audit.json
  audit_log: ""



# ─────────────────────────────────────────────────────────────────────────────
naming:
# ─────────────────────────────────────────────────────────────────────────────

  char_profile: linux
  char_substitutions: ""
  # Deprecated: drop a format_codes.yaml beside this file instead. What it
  # contains is merged over the table bundled with the package, so
  # overriding one abbreviation keeps the rest -- and keeps gaining
  # whatever later versions add.
  # format_codes: ""
  path_sep_replacement: ""
  control_replacement: ""
  case_dir:     lower
  case_disc:    lower
  case_song:    lower
  case_va_song: lower
  case_nfo:     lower
  case_m3u:     lower
  use_anv: true
  join_artists: ""
  variousartists: Various

# ─────────────────────────────────────────────────────────────────────────────
artwork:
# ─────────────────────────────────────────────────────────────────────────────

  embed_coverart: true
  image_policy: prefer_larger
  use_folder_jpg: true

  # Preferred source for cover art, independent of the metadata source.
  #
  #   auto         — use whichever source provided the metadata (default)
  #   discogs      — always use Discogs images
  #   musicbrainz  — always use Cover Art Archive images; if the metadata came
  #                  from Discogs, attempt a barcode-based MBID lookup first
  #
  # MusicBrainz Cover Art Archive advantages:
  #   • Images are explicitly typed (Front, Back, Medium/disc label, Booklet, …)
  #   • Often higher resolution (no size cap like Discogs)
  #   • Community-curated; approved flag filters out poor submissions
  image_source: auto
  download_only_cover: true

# ─────────────────────────────────────────────────────────────────────────────
archiving:
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────

  keep_original: true
  copy_other_files: false
  done_file: dt.done

  # What to do with the source directory after a successful tag operation.
  #   done_file — write a marker file and leave the source in place (default)
  #   remove    — delete the source directory (verifies sorted output first)
  #   move      — relocate the source directory into an archive tree
  source_action: done_file

  # Root directory for source_action=move (expand ~ paths).
  source_archive_dir: ""

  # Path template for source_action=move, relative to source_archive_dir.
  # Supports all standard format variables (%source%, %albumartist%, %album%,
  # %year%, %catno%, %format_code%, %edition%, …) plus:
  #   %current_folder% — original source directory basename (unchanged)
  source_move_template: "%source%/%albumartist%/%current_folder%"

# ─────────────────────────────────────────────────────────────────────────────
cue:
# ─────────────────────────────────────────────────────────────────────────────

  # Subdirectory where processed CUE sheets and source images are stashed.
  # This directory is excluded from subsequent directory scans.
  cue_done_dir: .cue

  # Automatically split CUE+image files found in source directories.
  parse_cue_files: false

# ─────────────────────────────────────────────────────────────────────────────
m4a:
# ─────────────────────────────────────────────────────────────────────────────
# .m4a files may contain either ALAC (lossless) or AAC (lossy) audio.
# These settings control what happens to each before tagging proceeds.

  # Detect and convert .m4a files found in source directories before tagging.
  convert_m4a_files: false

  # ALAC (lossless) handling:
  #   convert_to_flac — transcode losslessly to FLAC (recommended; matches
  #                     the format the rest of the library standardises on)
  #   keep            — leave as .m4a and tag in place
  alac_action: convert_to_flac

  # AAC (lossy) handling — converting lossy audio to FLAC just inflates file
  # size with no quality gain, so that option is intentionally not offered:
  #   keep            — leave as .m4a and tag in place
  #   convert_to_mp3  — re-encode to MP3 (lossy-to-lossy, e.g. for compatibility)
  #   convert_to_ogg  — re-encode to Ogg Vorbis (lossy-to-lossy)
  aac_action: keep

  # Subdirectory where original .m4a files are stashed after a conversion.
  # This directory is excluded from subsequent directory scans.
  m4a_done_dir: .m4a


# ─────────────────────────────────────────────────────────────────────────────
conversion:
# ─────────────────────────────────────────────────────────────────────────────
# Encoder settings shared by every audio conversion performed by cue and m4a
# processing above (CUE splitting and .m4a → FLAC/MP3/Ogg Vorbis conversion).

  # FLAC compression level: 0-8.
  #   0 — fastest encode,  largest files
  #   5 — flac/ffmpeg default
  #   8 — slowest encode,  smallest files (recommended if file size matters)
  # Always lossless regardless of level — only encode time and file size change.
  flac_compression_level: 8

  # MP3 encoding quality for AAC -> MP3 conversion (libmp3lame VBR -q:a scale).
  # 0 (best/largest) .. 9 (worst/smallest). Common choices:
  #   0 — ~220-260 kbps (transparent)
  #   2 — ~170-210 kbps (near-transparent, recommended default)
  #   4 — ~145-185 kbps
  #   6 — ~115-150 kbps
  #   9 — ~65-105 kbps
  mp3_quality: 2

  # Ogg Vorbis encoding quality for AAC -> Ogg conversion (libvorbis -q:a scale).
  # -1 (worst/smallest) .. 10 (best/largest). Common choices:
  #   1 — ~70 kbps
  #   3 — ~112 kbps
  #   5 — ~160 kbps (recommended default)
  #   7 — ~224 kbps
  #   9 — ~320 kbps
  ogg_quality: 5


# ─────────────────────────────────────────────────────────────────────────────
tags:
  keep_tags: freedb_id
# ─────────────────────────────────────────────────────────────────────────────



# ─────────────────────────────────────────────────────────────────────────────
suppress_tags:
# ─────────────────────────────────────────────────────────────────────────────


# ─────────────────────────────────────────────────────────────────────────────
replaygain:
# ─────────────────────────────────────────────────────────────────────────────

  add_tags: true
  application: r128gain


# ─────────────────────────────────────────────────────────────────────────────
cache:
# ─────────────────────────────────────────────────────────────────────────────

  directory: ""


# ─────────────────────────────────────────────────────────────────────────────
logging:
# ─────────────────────────────────────────────────────────────────────────────

  level: 20

  # Path to a persistent log file.  Leave empty to log to the terminal only.
  # The directory is created automatically if it does not exist.
  # Example: log_file: "~/.cache/massmusictagger/mmt.log"
  log_file: ""
