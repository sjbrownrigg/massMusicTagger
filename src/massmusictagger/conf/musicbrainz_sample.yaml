# ─────────────────────────────────────────────────────────────────────────────
# massMusicTagger — MusicBrainz sample configuration
# ─────────────────────────────────────────────────────────────────────────────
#
# DO NOT edit, rename, or delete this file — it is the reference template.
# Installation: copy to credentials/musicbrainz.yaml in your config directory
# and fill in your credentials. Every credentials/*.yaml there is loaded
# automatically — nothing needs listing in config.yaml.
#
# Better still, put credentials in the environment and leave this file's key
# fields empty: ACOUSTID_API_KEY and ACOUSTID_SUBMITTER_KEY both override it.

musicbrainz:
  # Required: user-agent identifying your application to the MB API.
  # Format: "AppName/Version (contact@example.com)"
  user_agent: "massMusicTagger/2.0.0 (your@email.com)"

  # ── AcoustID ────────────────────────────────────────────────────────────
  #
  # AcoustID issues two credentials and calls BOTH of them an "API key".
  # That is the whole confusion, so go by the URL rather than the name:
  #
  #   application key   register an app at https://acoustid.org/login
  #                     identifies the program.  Lookup uses this one.
  #
  #   submitter key     https://acoustid.org/api-key   <- yes, /api-key
  #                     identifies your account.  Submission uses this one.
  #
  # In code the difference is plain:
  #
  #   acoustid.match(api_key, path)              lookup      application key
  #   acoustid.submit(api_key, user_key, data)   submission  both
  #
  # They are not interchangeable, and a submitter key in acoustid_api_key
  # fails quietly -- lookups simply stop returning matches.

  # Application key, for fingerprint lookup (tiers 6-7).
  # Leave empty to skip the AcoustID tiers.
  # ACOUSTID_API_KEY in the environment overrides this, which is the better
  # place for it: a credential in the environment never has to be written
  # into a file that could be committed or reach an image layer.
  acoustid_api_key: ""

  # Submitter key. RESERVED -- massMusicTagger only performs lookups, so
  # nothing reads this yet. It is here so the key has a home that is not the
  # field it breaks. ACOUSTID_SUBMITTER_KEY overrides it.
  acoustid_submitter_key: ""

  # Run AcoustID fingerprinting before text search (tiers 6-7 are skipped
  # when this fires).  Costs fpcalc CPU + AcoustID network call on every
  # album; most effective for popular artists where title scoring is
  # unreliable.  Requires acoustid_api_key.
  acoustid_early: false

  # source_hints_file is now under [details] in config.yaml (shared by all sources).
  # Set details.source_hints_file: "" to disable, or override the path here
  # (musicbrainz.source_hints_file takes precedence over details.source_hints_file).
  # source_hints_file: ""

  # Disk cache directory.  All cache layers live under this root:
  #   releases/   — full release JSON (incl. track listings)
  #   caa/        — Cover Art Archive image index per release
  #   images/     — downloaded CAA image files (keyed by URL hash)
  #   searches/   — text and barcode search results (keyed by query hash)
  # Leave empty to use the cache root: MMT_CACHE_DIR when set, otherwise
  # $XDG_CACHE_HOME/massmusictagger. Do not hardcode a ~/ path here -- in a
  # container HOME is not necessarily writable, which used to kill the run on
  # startup. Set this only to put the cache somewhere specific.
  cache_directory: ""

  # Delay between Cover Art Archive requests (seconds).
  # The Internet Archive applies IP-based rate limits; a small pause keeps
  # requests within safe bounds and prevents your IP being throttled.
  # Increase if you see "rate-limited (429)" warnings in the log.
  # Set to 0 to disable (only safe when batch.workers = 1 and cache is warm).
  caa_request_delay: 0.5

  # ── Disk caches ──────────────────────────────────────────────────────────
  #
  # All three default to on. Turning one off means asking MusicBrainz or the
  # Cover Art Archive again every run, which is slower and less polite to a
  # free service -- worth it only when you are chasing a stale answer.
  #
  # The cache lives under cache_directory above, or the state directory when
  # that is unset.
  cache_metadata: true    # release JSON and the Cover Art Archive image index
  cache_images:   true     # the downloaded image files themselves
  cache_search:   true     # which release a search chose, not the response
